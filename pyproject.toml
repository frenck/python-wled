[project]
name = "wled"
version = "0.0.0"
description = "Asynchronous Python client for WLED."
authors = [{ name = "Franck Nijhof", email = "opensource@frenck.dev" }]
maintainers = [{ name = "Franck Nijhof", email = "opensource@frenck.dev" }]
license = "MIT"
requires-python = ">=3.11,<4.0"
readme = "README.md"
keywords = [
  "addressable-led",
  "api",
  "async",
  "client",
  "esp32",
  "esp8266",
  "home-assistant",
  "home-automation",
  "iot",
  "led",
  "led-strip",
  "lighting",
  "neopixel",
  "rgb",
  "smart-home",
  "wled",
  "ws2812b",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies"]
packages = [{ include = "wled", from = "src" }]
dependencies = [
  'aiohttp (>=3.9.0)',
  'awesomeversion (>=23.11.0)',
  'python-backoff (>=2.3.1)',
  'mashumaro (>=3.15,<4.0.0)',
  'orjson (>=3.9.8)',
  'yarl (>=1.9.10)',
]

[project.optional-dependencies]
cli = ["typer[all]>=0.24.0,<1.0.0", "zeroconf[all]>=0.149.16,<1.0.0"]

[project.scripts]
wled = "wled._cli:main"

[tool.poetry]
requires-poetry = '>=2.0'

[project.urls]
homepage = "https://github.com/frenck/python-wled"
repository = "https://github.com/frenck/python-wled"
documentation = "https://github.com/frenck/python-wled"
"Bug Tracker" = "https://github.com/frenck/python-wled/issues"
Changelog = "https://github.com/frenck/python-wled/releases"

[tool.poetry.group.dev.dependencies]
aioresponses = "0.7.9"
codespell = "2.4.3"
covdefaults = "2.3.0"
coverage = { version = "7.16.2", extras = ["toml"] }
pre-commit-hooks = "6.0.0"
prek = "0.5.5"
pylint = "4.1.2"
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
pytest-cov = "7.1.0"
ruff = "0.16.10"
safety = "3.8.1"
syrupy = "6.1.1"
ty = "0.0.86"
typer = "0.24.1"
yamllint = "1.38.0"
zizmor = "1.30.1"
actionlint-py = "1.7.12.25"
shellcheck-py = "0.11.0.1"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["wled"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ty.environment]
python-version = "3.11"

[tool.pylint.MASTER]
ignore = ["tests"]

[tool.pylint.BASIC]
good-names = ["_", "ex", "fp", "i", "id", "j", "k", "on", "Run", "T", "wv"]

[tool.pylint."MESSAGES CONTROL"]
disable = ["too-few-public-methods", "duplicate-code", "format", "unsubscriptable-object"]

[tool.pylint.SIMILARITIES]
ignore-imports = true

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pylint.DESIGN]
max-attributes = 40

[tool.pylint.TYPECHECK]
ignored-modules = ["orjson", "zeroconf", "zeroconf.asyncio"]

[tool.pytest.ini_options]
addopts = "--cov --strict-markers --strict-config"
asyncio_mode = "auto"
xfail_strict = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # Opinionated warning on disallowing dynamically typed expressions
  "CPY001",  # The project doesn't use copyright headers in its files
  "D203",    # Conflicts with other rules
  "D213",    # Conflicts with other rules
  "D417",    # False positives in some occasions
  "PLR2004", # Just annoying, not really useful

  # Conflicts with the Ruff formatter
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "FBT001", # Boolean positional args are idiomatic in parametrized tests
  "FBT002", # Boolean defaults are idiomatic in parametrized tests
]

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["wled"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["mashumaro.mixins.orjson.DataClassORJSONMixin"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.codespell]
ignore-words-list = "abl,hass"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
